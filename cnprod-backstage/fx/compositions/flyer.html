  <script>
    (function () {
      const FPS = 30;
      const DUR = 9;
      const IMPACT = 1.45; // SOLD OUT hits the paper

      // Seeded PRNG: every frame is a pure function of time.
      function rng(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const tl = gsap.timeline({ paused: true });

      // ---- 1. Camera settles from a tight framing -------------------------
      tl.fromTo("#fl-cam", { scale: 1.14, y: 70 }, { scale: 1, y: 0, duration: 1.3, ease: "expo.out" }, 0);

      // ---- 2. Blueprint scans in top to bottom -----------------------------
      tl.fromTo(
        "#fl-plan",
        { clipPath: "inset(0% 0% 62% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.85, ease: "sine.out" },
        0,
      );
      tl.fromTo("#fl-scan", { y: 730, opacity: 1 }, { y: 1990, duration: 0.85, ease: "sine.out" }, 0);
      tl.to("#fl-scan", { opacity: 0, duration: 0.12 }, 0.76);
      tl.to("#fl-under", { opacity: 0, duration: 0.2 }, 0.85);

      // ---- 3. BACKSTAGE inks on, left to right -----------------------------
      tl.fromTo(
        "#fl-bs",
        { clipPath: "polygon(0% 0%, 0% 0%, -8% 100%, 0% 100%)", filter: "blur(5px)" },
        {
          clipPath: "polygon(0% 0%, 112% 0%, 104% 100%, 0% 100%)",
          filter: "blur(0px)",
          duration: 0.62,
          ease: "power2.inOut",
        },
        0.38,
      );

      // ---- 4. SOLD OUT stamp ------------------------------------------------
      const fall = 0.24;
      tl.fromTo(
        "#fl-so-wrap",
        { scale: 2.7, rotation: -13, opacity: 0, filter: "blur(9px)" },
        { scale: 0.965, rotation: 0, opacity: 1, filter: "blur(0px)", duration: fall, ease: "power4.in" },
        IMPACT - fall,
      );
      tl.to("#fl-so-wrap", { scale: 1, duration: 0.42, ease: "elastic.out(1, 0.45)" }, IMPACT);
      // Shadow closes in under the falling stamp.
      tl.fromTo(
        "#fl-so-shadow",
        { scale: 1.35, opacity: 0, x: 30, y: 40 },
        { scale: 1, opacity: 0.32, x: 0, y: 0, duration: fall, ease: "power4.in" },
        IMPACT - fall,
      );
      tl.to("#fl-so-shadow", { opacity: 0, duration: 0.18, ease: "power2.out" }, IMPACT);

      // Impact: flash, rings, camera kick, RGB split, splatter.
      // Pulses use set() + to(): a set reverts cleanly on any seek order,
      // where a fromTo would leave its "from" state behind before it starts.
      tl.set("#fl-flash", { opacity: 0.5 }, IMPACT);
      tl.to("#fl-flash", { opacity: 0, duration: 0.24, ease: "expo.out" }, IMPACT);
      tl.set("#fl-ring-stamp", { scale: 0.35, opacity: 0.9 }, IMPACT);
      tl.to("#fl-ring-stamp", { scale: 3.4, opacity: 0, duration: 0.6, ease: "expo.out" }, IMPACT);
      tl.set("#fl-ring-dust", { scale: 0.5, opacity: 0.85 }, IMPACT);
      tl.to("#fl-ring-dust", { scale: 2.6, opacity: 0, duration: 0.8, ease: "expo.out" }, IMPACT);
      tl.set("#fl-cam", { scale: 1.045 }, IMPACT);
      tl.to("#fl-cam", { scale: 1, duration: 0.55, ease: "expo.out" }, IMPACT);
      tl.set("#fl-so-cyan", { x: -30, y: 6, opacity: 0.9 }, IMPACT);
      tl.to("#fl-so-cyan", { x: 0, y: 0, opacity: 0, duration: 0.36, ease: "expo.out" }, IMPACT);
      tl.set("#fl-so-violet", { x: 26, y: -5, opacity: 0.85 }, IMPACT);
      tl.to("#fl-so-violet", { x: 0, y: 0, opacity: 0, duration: 0.36, ease: "expo.out" }, IMPACT);
      document.querySelectorAll("#root .fl-drop").forEach(function (el, i) {
        const dx = parseFloat(el.dataset.dx);
        const dy = parseFloat(el.dataset.dy);
        tl.set(el, { x: 0, y: 0, scale: 0.4, opacity: 1 }, IMPACT);
        tl.to(el, { x: dx, y: dy, scale: 1, duration: 0.5 + (i % 4) * 0.06, ease: "expo.out" }, IMPACT);
        tl.to(el, { opacity: 0, scale: 0.6, duration: 0.5, ease: "power2.in" }, IMPACT + 0.9 + (i % 5) * 0.08);
      });

      // Screen shake: decaying, per frame.
      (function () {
        const r = rng(42);
        const frames = Math.round(0.5 * FPS);
        for (let f = 0; f <= frames; f++) {
          const t = f / FPS;
          const k = Math.exp(-7 * t);
          tl.set(
            "#fl-shake",
            {
              x: (r() * 2 - 1) * 26 * k,
              y: (r() * 2 - 1) * 20 * k,
              rotation: (r() * 2 - 1) * 1.1 * k,
            },
            IMPACT + t,
          );
        }
        tl.set("#fl-shake", { x: 0, y: 0, rotation: 0 }, IMPACT + (frames + 1) / FPS);
      })();

      // ---- 5. Living details ----------------------------------------------
      // Stars twinkle.
      [
        ["#fl-star-a", 2.05],
        ["#fl-star-c", 2.25],
        ["#fl-star-b", 2.45],
        ["#fl-star-d", 3.2],
        ["#fl-star-c", 5.35],
        ["#fl-star-a", 5.55],
        ["#fl-star-d", 6.75],
        ["#fl-star-b", 7.55],
      ].forEach(function (s) {
        tl.set(s[0], { scale: 0, rotation: -45, opacity: 1 }, s[1]);
        tl.to(s[0], { scale: 1, rotation: 0, duration: 0.22, ease: "power3.out" }, s[1]);
        tl.to(s[0], { scale: 0, rotation: 45, duration: 0.3, ease: "power2.in" }, s[1] + 0.22);
      });

      // EXIT neon stutters on, then stays lit with two later flickers.
      (function () {
        const on = function (t, v) {
          tl.set(["#fl-exit", "#fl-exit-glow"], { opacity: v }, t);
        };
        const seq = [
          [1.9, 0.9], [1.97, 0], [2.03, 1], [2.1, 0.15], [2.17, 0], [2.27, 1],
          [4.6, 0.2], [4.65, 1], [4.73, 0], [4.8, 1],
          [7.25, 0], [7.32, 1], [7.36, 0.3], [7.42, 1],
        ];
        seq.forEach(function (s) { on(s[0], s[1]); });
      })();

      // Sheen sweeps.
      tl.fromTo("#fl-so-sheen", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.75, ease: "power2.inOut" }, 2.55);
      tl.fromTo("#fl-bs-sheen", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.8, ease: "power2.inOut" }, 5.2);
      tl.fromTo("#fl-so-sheen", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 0.75, ease: "power2.inOut", immediateRender: false }, 7.0);

      // Stage spots fire in order, like lights on a beat.
      [["#fl-spot-1", 4.85], ["#fl-spot-2", 5.05], ["#fl-spot-3", 5.25], ["#fl-spot-4", 5.45]].forEach(function (s) {
        tl.set(s[0], { scale: 0.7, opacity: 1 }, s[1]);
        tl.to(s[0], { scale: 2.3, opacity: 0, duration: 0.6, ease: "expo.out" }, s[1]);
      });

      // Glitch hits on SOLD OUT.
      function glitch(t0, len, seed, amp) {
        const r = rng(seed);
        const frames = Math.round(len * FPS);
        for (let f = 0; f < frames; f++) {
          const t = t0 + f / FPS;
          const live = r() > 0.25;
          tl.set("#fl-so-s1", { x: live ? (r() * 2 - 1) * amp : 0, opacity: live ? 1 : 0 }, t);
          tl.set("#fl-so-s2", { x: live ? (r() * 2 - 1) * amp * 1.4 : 0, opacity: live ? 1 : 0 }, t);
          tl.set("#fl-so-s3", { x: (r() * 2 - 1) * amp * 0.8, opacity: r() > 0.4 ? 1 : 0 }, t);
          tl.set("#fl-so-cyan", { x: -(4 + r() * 16), y: 0, opacity: 0.85 }, t);
          tl.set("#fl-so-violet", { x: 4 + r() * 14, y: 0, opacity: 0.8 }, t);
          tl.set("#fl-so", { opacity: r() > 0.3 ? 1 : 0.55, x: (r() * 2 - 1) * 5 }, t);
          tl.set("#fl-shake", { x: (r() * 2 - 1) * 4 }, t);
        }
        const end = t0 + frames / FPS;
        tl.set([".fl-slice"], { x: 0, opacity: 0 }, end);
        tl.set(["#fl-so-cyan", "#fl-so-violet"], { x: 0, y: 0, opacity: 0 }, end);
        tl.set("#fl-so", { opacity: 1, x: 0 }, end);
        tl.set("#fl-shake", { x: 0 }, end);
      }
      glitch(3.9, 0.27, 7, 46);
      glitch(6.15, 0.33, 19, 64);
      glitch(8.05, 0.23, 31, 40);

      // Light leak drifts slowly across the page.
      tl.fromTo("#fl-leak", { opacity: 0.6, x: -60 }, { opacity: 0.28, x: 60, duration: DUR, ease: "none" }, 0);

      // ---- 6. Film grain + projector flicker, per frame -----------------------
      (function () {
        const r = rng(1234);
        const total = Math.round(DUR * FPS);
        for (let f = 0; f < total; f++) {
          const t = f / FPS;
          tl.set("#fl-grain", { backgroundPosition: Math.floor(r() * 720) + "px " + Math.floor(r() * 720) + "px" }, t);
          tl.set("#fl-flicker", { opacity: r() * 0.045 }, t);
        }
      })();

      window.__timelines = window.__timelines || {};
      window.__timelines["flyer"] = tl;
