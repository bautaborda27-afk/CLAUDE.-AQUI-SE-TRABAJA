<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #e4d9d3;
    }
    #root .fl-full {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
    #fl-cam {
      position: absolute;
      inset: 0;
      transform-origin: 540px 960px;
    }
    #fl-bs {
      clip-path: polygon(0% 0%, 0% 0%, -6% 100%, 0% 100%);
    }
    #fl-so-wrap {
      position: absolute;
      inset: 0;
      transform-origin: 543px 1123px;
    }
  </style>

  <div id="root" data-composition-id="flyer" data-width="1080" data-height="1920">
    <div id="fl-cam">
      <img id="fl-plan" class="fl-full" src="assets/plan.png" alt="" />
      <img id="fl-bs" class="fl-full" src="assets/backstage.png" alt="BACKSTAGE" />
      <div id="fl-so-wrap">
        <img id="fl-so" class="fl-full" src="assets/soldout.png" alt="SOLD OUT" />
      </div>
    </div>
  </div>

  <script>
    (function () {
      const STAMP = 1.5; // SOLD OUT touches the paper

      const tl = gsap.timeline({ paused: true });

      // The page settles in, barely.
      tl.fromTo("#fl-cam", { scale: 1.03 }, { scale: 1, duration: 1.3, ease: "expo.out" }, 0);

      // BACKSTAGE: one clean wipe, left to right.
      tl.fromTo(
        "#fl-bs",
        { clipPath: "polygon(0% 0%, 0% 0%, -6% 100%, 0% 100%)" },
        {
          clipPath: "polygon(0% 0%, 108% 0%, 102% 100%, 0% 100%)",
          duration: 0.8,
          ease: "power2.inOut",
        },
        0.25,
      );

      // SOLD OUT: set down like a stamp, no bounce.
      tl.fromTo(
        "#fl-so-wrap",
        { scale: 1.14, rotation: -2.5, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.2, ease: "power3.in" },
        STAMP - 0.2,
      );
      // The page gives a hair under the stamp.
      tl.set("#fl-cam", { scale: 1.006 }, STAMP);
      tl.to("#fl-cam", { scale: 1, duration: 0.45, ease: "expo.out" }, STAMP);

      window.__timelines = window.__timelines || {};
      window.__timelines["flyer"] = tl;
    })();
  </script>
</template>
