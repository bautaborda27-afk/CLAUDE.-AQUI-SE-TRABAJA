  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector(s);
      const qa = (s) => document.querySelectorAll(s);

      /* ---------- world: satin drift + glitter (functions of time) ---------- */
      tl.fromTo("#fl-satin", { x: -70, y: -20 }, { x: 70, y: 20, duration: 12, ease: "sine.inOut" }, 0);

      const cv = q("#fl-dust");
      const cx = cv.getContext("2d");
      let seed = 11;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };
      const ambient = [];
      for (let i = 0; i < 70; i++) {
        ambient.push({
          x: 70 + rnd() * 940,
          y: rnd() * 1920,
          r: 0.5 + rnd() * rnd() * 1.8,
          a: 0.25 + rnd() * 0.45,
          vy: 6 + rnd() * 14,
          ph: rnd() * 6.283,
          f: 0.5 + rnd() * 1.4,
          t0: rnd() * 2.4,
        });
      }
      const fizz = [];
      for (let i = 0; i < 46; i++) {
        fizz.push({
          x: 380 + rnd() * 320,
          y: 1440 + rnd() * 120,
          r: 0.6 + rnd() * rnd() * 2.0,
          a: 0.45 + rnd() * 0.45,
          vy: 40 + rnd() * 60,
          drift: (rnd() - 0.5) * 120,
          L: 3.2 + rnd() * 2.6,
          off: rnd() * 6,
          ph: rnd() * 6.283,
        });
      }
      function dot(x, y, r, al) {
        const g = cx.createRadialGradient(x, y, 0, x, y, r * 3);
        g.addColorStop(0, "rgba(255,246,220," + al + ")");
        g.addColorStop(0.3, "rgba(214,170,88," + al * 0.8 + ")");
        g.addColorStop(1, "rgba(214,170,88,0)");
        cx.fillStyle = g;
        cx.beginPath();
        cx.arc(x, y, r * 3, 0, Math.PI * 2);
        cx.fill();
      }
      function draw(t) {
        cx.clearRect(0, 0, 1080, 1920);
        for (const p of ambient) {
          const life = Math.min(1, Math.max(0, (t - p.t0) / 1.4));
          if (life <= 0) continue;
          const y = (((p.y - p.vy * t) % 1920) + 1920) % 1920;
          const x = p.x + Math.sin(t * 0.45 + p.ph) * 8;
          const tw = 0.55 + 0.45 * Math.sin(t * p.f * 2 + p.ph);
          dot(x, y, p.r, p.a * life * tw);
        }
        const on = Math.min(1, Math.max(0, (t - 7.6) / 1.2));
        if (on > 0) {
          for (const p of fizz) {
            const u = ((t + p.off) % p.L) / p.L;
            const k = u * p.L;
            const x = p.x + p.drift * u + Math.sin(k * 1.7 + p.ph) * 6;
            const y = p.y - p.vy * k;
            const al = p.a * Math.sin(Math.PI * u) * on;
            dot(x, y, p.r, al);
          }
        }
      }
      const clock = { t: 0 };
      tl.to(clock, { t: 12, duration: 12, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      draw(0);

      /* ---------- frame draws from the top star ---------- */
      ["#fl-frame-l", "#fl-frame-r"].forEach((id) => {
        const el = q(id);
        const len = el.getTotalLength();
        tl.fromTo(
          el,
          { strokeDasharray: len, strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" },
          0,
        );
      });
      tl.fromTo("#fl-frame-in", { opacity: 0 }, { opacity: 0.55, duration: 1.2, ease: "power1.out" }, 1.4);
      tl.fromTo("#fl-jewels", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.0);
      tl.fromTo(
        "#fl-star-top",
        { scale: 0.2, rotation: -90, opacity: 0, svgOrigin: "0 0" },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.9, ease: "expo.out" },
        0,
      );
      tl.fromTo(
        "#fl-star-bot",
        { scale: 0.2, rotation: 90, opacity: 0, svgOrigin: "0 0" },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.9, ease: "expo.out" },
        1.75,
      );

      /* ---------- logo ---------- */
      tl.fromTo(
        "#fl-logo-img",
        { opacity: 0, scale: 1.05, filter: "blur(12px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.3, ease: "expo.out" },
