    .sweep {

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector(s);

      /* ---------- the room: warm light drifting over the sheet, dust in the air ---------- */
      tl.fromTo("#pp-light", { x: -160, y: 60 }, { x: 160, y: -60, duration: 15, ease: "sine.inOut" }, 0);

      const cv = q("#pp-dust");
      const cx = cv.getContext("2d");
      let seed = 23;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };
      const motes = [];
      for (let i = 0; i < 55; i++) {
        motes.push({ x: rnd() * 1080, y: rnd() * 1920, r: 0.6 + rnd() * rnd() * 2.2, a: 0.18 + rnd() * 0.35,
          vy: 5 + rnd() * 12, vx: (rnd() - 0.5) * 10, ph: rnd() * 6.283, f: 0.4 + rnd() * 1.2 });
      }
      function draw(t) {
        cx.clearRect(0, 0, 1080, 1920);
        const fade = Math.min(1, t / 1.5);
        for (const p of motes) {
          const y = (((p.y - p.vy * t) % 1920) + 1920) % 1920;
          const x = (((p.x + p.vx * t + Math.sin(t * 0.4 + p.ph) * 10) % 1080) + 1080) % 1080;
          const al = p.a * fade * (0.55 + 0.45 * Math.sin(t * p.f * 2 + p.ph));
          const g = cx.createRadialGradient(x, y, 0, x, y, p.r * 3);
          g.addColorStop(0, "rgba(255,248,228," + al + ")");
          g.addColorStop(0.35, "rgba(232,200,140," + al * 0.7 + ")");
          g.addColorStop(1, "rgba(232,200,140,0)");
          cx.fillStyle = g;
          cx.beginPath();
          cx.arc(x, y, p.r * 3, 0, Math.PI * 2);
          cx.fill();
        }
      }
      const clock = { t: 0 };
      tl.to(clock, { t: 15, duration: 15, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      draw(0);

      /* ---------- helpers ---------- */
      // pencil outline, then ink chasing it, then the outline lifts away
      function letter(id, at, sketchDur, inkDur) {
        tl.fromTo(id + " .sk", { "--p": 0 }, { "--p": 118, duration: sketchDur, ease: "power1.inOut" }, at);
        tl.fromTo(id + " .fl", { "--p": 0 }, { "--p": 118, duration: inkDur, ease: "power1.inOut" }, at + sketchDur * 0.3);
        tl.fromTo(id + " .sk", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.out" }, at + sketchDur * 0.3 + inkDur);
      }
      function brush(id, at, dur, ease) {
        const p = q(id);
        const len = p.getTotalLength() + 140;
        tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: ease || "power1.inOut" }, at);
      }
      function star(id, at) {
        tl.fromTo(
          id,
          { opacity: 0, scale: 0.2, rotation: -70, filter: "blur(4px)" },
          { opacity: 1, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.75, ease: "expo.out" },
          at,
        );
      }

      /* ---------- drawing order ---------- */
      letter("#pp-logo", 0.3, 0.5, 0.6);
      brush("#pp-b-tl", 0.5, 1.6);
      tl.fromTo("#pp-chain .wipe-down", { "--p": 0 }, { "--p": 118, duration: 0.5, ease: "power2.inOut" }, 0.8);
      tl.fromTo("#pp-ball .sweep", { "--a": -17 }, { "--a": 360, duration: 1.3, ease: "power2.inOut" }, 1.2);
      tl.fromTo("#pp-rays .burst", { "--r": 110 }, { "--r": 420, duration: 0.6, ease: "expo.out" }, 2.4);
      star("#pp-star1", 1.8);

      letter("#pp-con", 2.0, 0.5, 0.7);
      letter("#pp-cuarto", 2.6, 1.1, 1.2);
      letter("#pp-desp", 3.9, 1.1, 1.3);
      letter("#pp-elano", 5.0, 0.8, 0.95);
      tl.fromTo("#pp-swash .fl", { "--p": 0 }, { "--p": 118, duration: 0.7, ease: "power2.inOut" }, 6.1);
      brush("#pp-b-r", 6.3, 0.8);
      star("#pp-star2", 6.6);

      tl.fromTo("#pp-oval .sweep", { "--a": -17 }, { "--a": 360, duration: 1.1, ease: "power2.inOut" }, 6.9);
      letter("#pp-date", 7.6, 0.9, 1.0);
      star("#pp-starL", 8.7);
      star("#pp-starR", 8.85);

      letter("#pp-tag", 9.0, 1.1, 1.2);
      tl.fromTo("#pp-divider .centre-out", { "--p": 0, opacity: 0 }, { "--p": 100, opacity: 1, duration: 0.8, ease: "power3.out" }, 10.3);
      brush("#pp-b-b1", 10.6, 2.1);
      brush("#pp-b-b2", 12.0, 0.9);

      /* ---------- finished: the ball catches the light ---------- */
      [["#pp-g1", 12.7], ["#pp-g2", 13.0], ["#pp-g3", 13.35], ["#pp-g4", 13.7]].forEach(([id, at]) => {
        tl.fromTo(id, { scale: 0, rotation: -45, opacity: 0, svgOrigin: "0 0" },
          { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, at);
        tl.to(id, { scale: 0.35, opacity: 0.5, duration: 0.7, ease: "power2.inOut" }, at + 0.5);
      });
      tl.to("#pp-g1", { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 14.2);
      tl.to("#pp-star1", { scale: 1.18, duration: 0.3, ease: "power2.out" }, 13.2);
      tl.to("#pp-star1", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 13.5);
      tl.to("#pp-starR", { scale: 1.18, duration: 0.3, ease: "power2.out" }, 13.9);
      tl.to("#pp-starR", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 14.2);

      window.__timelines["papel"] = tl;
    })();
  </script>
