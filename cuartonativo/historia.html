<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cuarto Nativo · Despedida de año</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cinzel:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root{
    --ivory:#fbf5ec;
    --champagne:#f1e4d0;
    --sand:#e6d2b5;
    --burgundy:#622c34;
    --espresso:#4a3329;
    --gold-dark:#8a6428;
    --gold:#b98a3e;
    --gold-light:#efd9a0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--champagne)}
  .story{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(ellipse 62% 38% at 50% 30%, rgba(255,252,246,.95) 0%, rgba(255,252,246,0) 72%),
      radial-gradient(ellipse 80% 30% at 50% 82%, rgba(255,248,236,.55) 0%, rgba(255,248,236,0) 70%),
      linear-gradient(180deg,#f7eee2 0%,#f4e8d7 40%,#efdfc8 75%,#ead7bc 100%);
  }
  /* satin light, falling diagonally */
  .satin{position:absolute;inset:-200px;filter:blur(38px);opacity:.9;
    background:
      linear-gradient(118deg,
        transparent 0%, transparent 14%,
        rgba(255,255,255,.55) 18%, transparent 24%,
        transparent 33%, rgba(214,186,146,.16) 38%, transparent 44%,
        rgba(255,255,255,.45) 50%, transparent 56%,
        transparent 64%, rgba(214,186,146,.14) 70%, transparent 76%,
        rgba(255,255,255,.40) 82%, transparent 88%);
  }
  .grain{position:absolute;inset:0;opacity:.11;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  .vignette{position:absolute;inset:0;
    background:radial-gradient(ellipse 75% 62% at 50% 46%, transparent 55%, rgba(150,108,62,.20) 100%);}

  .frame{position:absolute;inset:0}
  .dust{position:absolute;inset:0}

  .layer{position:absolute;left:0;width:100%;text-align:center}

  .logo{top:200px}
  .logo img{width:300px;display:block;margin:0 auto;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.7)) drop-shadow(0 4px 10px rgba(98,44,52,.10))}

  .lead{top:440px;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:86px;line-height:1;
    color:var(--espresso);letter-spacing:-.005em;
    text-shadow:0 1px 0 rgba(255,255,255,.75)}

  .foil{
    background:linear-gradient(100deg,
      #7c5524 0%, #a27330 14%, #cda75f 28%, #e9cf8f 38%, #c99d50 48%,
      #9c6e2b 60%, #87601f 68%, #b58a40 80%, #dcbd78 89%, #946a2a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1.5px 0 rgba(255,251,242,.85)) drop-shadow(0 8px 16px rgba(130,88,32,.16));
  }
  .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:176px;
    line-height:.86;letter-spacing:-.012em}
  .l1{top:548px}
  .l2{top:700px}

  .swash{top:884px}
  .date{top:982px}
  .date .wrap{position:relative;width:660px;height:124px;margin:0 auto}
  .date svg{position:absolute;inset:0}
  .date .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:500;font-size:38px;letter-spacing:.34em;padding-left:.34em;
    color:var(--burgundy);word-spacing:-.18em}
  .date .txt b{font-weight:600;font-size:46px;letter-spacing:.12em;margin-right:.3em;
    background:linear-gradient(180deg,#a87a33,#d9b66c 45%,#8a6428);-webkit-background-clip:text;background-clip:text;color:transparent}

  .tag{top:1152px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:62px;
    color:var(--burgundy);letter-spacing:.005em;text-shadow:0 1px 0 rgba(255,255,255,.7)}

  .divider{top:1252px}

  .glasses{top:1276px}
  .glasses img{width:1080px;display:block;mix-blend-mode:multiply}
</style>
</head>
<body>
<div class="story" id="story">
  <div class="satin"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <canvas class="dust" id="dust" width="1080" height="1920"></canvas>

  <!-- Frame -->
  <svg class="frame" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9a7030"/>
        <stop offset=".3" stop-color="#e3c788"/>
        <stop offset=".5" stop-color="#b48638"/>
        <stop offset=".72" stop-color="#ead39a"/>
        <stop offset="1" stop-color="#8f6628"/>
      </linearGradient>
      <linearGradient id="gh" gradientUnits="userSpaceOnUse" x1="-250" y1="0" x2="250" y2="0">
        <stop offset="0" stop-color="#b48638" stop-opacity="0"/>
        <stop offset=".5" stop-color="#b48638"/>
        <stop offset="1" stop-color="#b48638" stop-opacity="0"/>
      </linearGradient>
      <symbol id="star" viewBox="-10 -10 20 20">
        <path d="M0,-10 C.9,-2.2 2.2,-.9 10,0 C2.2,.9 .9,2.2 0,10 C-.9,2.2 -2.2,.9 -10,0 C-2.2,-.9 -.9,-2.2 0,-10Z" fill="url(#g)"/>
      </symbol>
    </defs>
    <!-- outer hairline with concave corners, gaps for top/bottom stars -->
    <g fill="none" stroke="url(#g)" stroke-width="1.6">
      <path d="M516,44 H70 A26,26 0 0 1 44,70 V1850 A26,26 0 0 1 70,1876 H516"/>
      <path d="M564,44 H1010 A26,26 0 0 0 1036,70 V1850 A26,26 0 0 0 1010,1876 H564"/>
    </g>
    <!-- inner hairline -->
    <g fill="none" stroke="url(#g)" stroke-width=".8" opacity=".55">
      <path d="M84,58 H996 A28,28 0 0 0 1022,84 V1836 A28,28 0 0 0 996,1862 H84 A28,28 0 0 0 58,1836 V84 A28,28 0 0 0 84,58Z"/>
    </g>
    <!-- corner jewels -->
    <g fill="url(#g)">
      <circle cx="44" cy="44" r="3"/><circle cx="1036" cy="44" r="3"/>
      <circle cx="44" cy="1876" r="3"/><circle cx="1036" cy="1876" r="3"/>
    </g>
    <use href="#star" x="527" y="31" width="26" height="26"/>
    <use href="#star" x="527" y="1863" width="26" height="26"/>

    <!-- ornament under logo -->
    <g transform="translate(540,386)">
      <line x1="-150" y1="0" x2="-16" y2="0" stroke="url(#gh)" stroke-width="1"/>
      <line x1="16" y1="0" x2="150" y2="0" stroke="url(#gh)" stroke-width="1"/>
      <use href="#star" x="-7" y="-7" width="14" height="14"/>
    </g>

    <!-- divider above glasses -->
    <g transform="translate(540,1252)">
      <line x1="-250" y1="0" x2="-22" y2="0" stroke="url(#gh)" stroke-width="1.2"/>
      <line x1="22" y1="0" x2="250" y2="0" stroke="url(#gh)" stroke-width="1.2"/>
      <circle cx="-34" cy="0" r="2" fill="#b48638"/><circle cx="34" cy="0" r="2" fill="#b48638"/>
      <use href="#star" x="-11" y="-11" width="22" height="22"/>
    </g>
  </svg>

  <div class="layer logo"><img src="assets/logo_burgundy.png" alt="Cuarto Nativo"></div>

  <div class="layer lead">Con Cuarto Nativo,</div>
  <div class="layer big l1"><span class="foil">despedimos</span></div>
  <div class="layer big l2"><span class="foil">el año.</span></div>

  <!-- calligraphic swash -->
  <div class="layer swash">
    <svg width="560" height="60" viewBox="0 0 560 60" aria-hidden="true" style="display:block;margin:0 auto">
      <defs>
        <linearGradient id="sw" x1="0" x2="1">
          <stop offset="0" stop-color="#b48638" stop-opacity="0"/>
          <stop offset=".18" stop-color="#a87a33"/>
          <stop offset=".45" stop-color="#ead39a"/>
          <stop offset=".7" stop-color="#b48638"/>
          <stop offset="1" stop-color="#b48638" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M6,40 C120,50 200,26 290,22 C380,18 450,28 548,12
               C452,34 382,26 292,28 C204,32 122,54 6,40Z" fill="url(#sw)"/>
      <path d="M150,44 C230,36 300,34 370,36" fill="none" stroke="url(#sw)" stroke-width=".8" opacity=".6"/>
    </svg>
  </div>

  <div class="layer date">
    <div class="wrap">
      <svg viewBox="0 0 660 124" width="660" height="124" aria-hidden="true">
        <defs>
          <linearGradient id="cg" x1="0" x2="1">
            <stop offset="0" stop-color="#9a7030"/><stop offset=".3" stop-color="#e3c788"/>
            <stop offset=".5" stop-color="#b48638"/><stop offset=".75" stop-color="#ead39a"/>
            <stop offset="1" stop-color="#9a7030"/>
          </linearGradient>
        </defs>
        <path d="M34,2 H626 A32,32 0 0 0 658,34 V90 A32,32 0 0 0 626,122 H34 A32,32 0 0 0 2,90 V34 A32,32 0 0 0 34,2Z"
              fill="rgba(255,250,242,.35)" stroke="url(#cg)" stroke-width="1.6"/>
        <path d="M42,10 H618 A26,26 0 0 0 650,40 V84 A26,26 0 0 0 618,114 H42 A26,26 0 0 0 10,84 V40 A26,26 0 0 0 42,10Z"
              fill="none" stroke="url(#cg)" stroke-width=".8" opacity=".6"/>
        <path d="M34,62 l6,-6 l6,6 l-6,6z M614,62 l6,-6 l6,6 l-6,6z" fill="url(#cg)"/>
      </svg>
      <div class="txt"><b>19</b>DE DICIEMBRE</div>
    </div>
  </div>

  <div class="layer tag">Te invitamos a ser parte.</div>

  <div class="layer glasses"><img src="assets/illustration_mult.png" alt=""></div>

  <!-- sparkles -->
  <svg class="frame" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true" style="pointer-events:none">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#fff6dc" stop-opacity=".9"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient>
      <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c79a4b"/><stop offset=".5" stop-color="#f3e2b0"/><stop offset="1" stop-color="#a87a33"/>
      </linearGradient>
      <symbol id="sp" viewBox="-10 -10 20 20">
        <circle r="9" fill="url(#glow)"/>
        <path d="M0,-10 C.7,-1.6 1.6,-.7 10,0 C1.6,.7 .7,1.6 0,10 C-.7,1.6 -1.6,.7 -10,0 C-1.6,-.7 -.7,-1.6 0,-10Z" fill="url(#sg)"/>
      </symbol>
    </defs>
    <use href="#sp" x="866" y="552" width="34" height="34"/>
    <use href="#sp" x="904" y="604" width="16" height="16" opacity=".8"/>
    <use href="#sp" x="164" y="796" width="26" height="26"/>
    <use href="#sp" x="200" y="774" width="12" height="12" opacity=".75"/>
    <use href="#sp" x="812" y="246" width="18" height="18" opacity=".8"/>
    <use href="#sp" x="226" y="1158" width="16" height="16" opacity=".7"/>
    <use href="#sp" x="840" y="1146" width="20" height="20" opacity=".8"/>
  </svg>
</div>

<script>
  // delicate gold dust (deterministic)
  (function(){
    const c=document.getElementById('dust'),x=c.getContext('2d');
    let s=7; const r=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};
    const zones=[[540,560,470,330,46],[540,1400,430,160,34],[540,1080,500,520,22]];
    for(const [cx,cy,rx,ry,n] of zones){
      for(let i=0;i<n;i++){
        const a=r()*Math.PI*2, d=Math.sqrt(r());
        const px=cx+Math.cos(a)*rx*d, py=cy+Math.sin(a)*ry*d;
        const rad=.5+r()*r()*1.8, al=.35+r()*.5;
        const g=x.createRadialGradient(px,py,0,px,py,rad*3);
        g.addColorStop(0,`rgba(255,246,220,${al})`);
        g.addColorStop(.3,`rgba(214,170,88,${al*.8})`);
        g.addColorStop(1,'rgba(214,170,88,0)');
        x.fillStyle=g;x.beginPath();x.arc(px,py,rad*3,0,Math.PI*2);x.fill();
      }
    }
  })();
</script>
</body>
</html>
